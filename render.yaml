services:
  - type: web
    name: staffgo-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx puppeteer browsers install chrome && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/.cache/puppeteer
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DEFAULT_VAT_RATE
        value: "15"
      - key: DEFAULT_CURRENCY
        value: SAR
